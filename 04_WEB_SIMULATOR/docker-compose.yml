# Local development stack: PostgreSQL + the app.
#   docker compose up --build        -> http://localhost:3000
# The app container pushes the schema and ingests the derived dataset on first start.
services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    environment:
      POSTGRES_USER: splane
      POSTGRES_PASSWORD: splane
      POSTGRES_DB: splane
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splane -d splane"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://splane:splane@db:5432/splane?schema=public
      DIRECT_URL: postgresql://splane:splane@db:5432/splane?schema=public
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-local-dev-secret-change-me}
      GITHUB_ID: ${GITHUB_ID:-}
      GITHUB_SECRET: ${GITHUB_SECRET:-}
      EMAIL_SERVER: ${EMAIL_SERVER:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      LIVE_SERVICE_URL: ${LIVE_SERVICE_URL:-}
    ports:
      - "3000:3000"

volumes:
  pgdata:
