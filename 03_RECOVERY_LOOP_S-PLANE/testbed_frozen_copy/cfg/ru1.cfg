# ITU-T G.8275.1 telecom profile (full timing support)
# Cross-checked line-by-line against linuxptp's own configs/G.8275.1.cfg (upstream
# reference implementation) and against the real TIMESAFE hardware captures.
#
# CORRECTIONS applied 2026-09-17 (both pre-freeze, both verified defects):
#  (1) dataset_comparison G.8275.x was MISSING. Without it linuxptp runs the IEEE 1588
#      DEFAULT BMCA, not the G.8275.1 ALTERNATE BMCA. The two differ in exactly the way
#      that matters here: the alternate BMCA ignores priority1 and applies localPriority.
#      The previous "verified compliant by parsing its own capture" check could not have
#      caught this - the BMCA algorithm is not a wire field and is invisible in a capture.
#  (2) path_trace_enabled 1 was REMOVED. It is not in the upstream G.8275.1 profile, and
#      the real TIMESAFE captures contain ZERO TLVs in 522,731 packets. Leaving it on
#      would make PATH_TRACE presence a perfect separator between testbed-benign and
#      TIMESAFE-attack data - the same provenance-leak class as the 16x cadence confound.
#
# DELIBERATE DEVIATION from linuxptp's example, with reason:
#   ptp_dst_mac 01:1B:19:00:00:00 (forwardable) instead of the example's
#   01:80:C2:00:00:0E. G.8275.1 permits BOTH. The real TIMESAFE fronthaul uses
#   01:1b:19:00:00:00 on 100% of 274,090 verified packets, so matching the real
#   deployment is preferred over matching the example file.
[global]
dataset_comparison              G.8275.x
domainNumber                    24
priority1                       128
priority2                       128
logAnnounceInterval             -3
logSyncInterval                 -4
logMinDelayReqInterval          -4
announceReceiptTimeout          3
delay_mechanism                 E2E
network_transport               L2
ptp_dst_mac                     01:1B:19:00:00:00
time_stamping                   software
G.8275.defaultDS.localPriority  128
G.8275.portDS.localPriority     128
maxStepsRemoved                 255
clock_class_threshold           248
twoStepFlag                     1
assume_two_step                 0
tx_timestamp_timeout            200
free_running                    1
clock_servo                     pi
summary_interval                0
logging_level                   6
verbose                         1
use_syslog                      0

priority2                       128
clientOnly                      1
[v-ru1]
